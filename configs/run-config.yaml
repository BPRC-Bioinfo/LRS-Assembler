species: "species name"
annotation_ref:
  reference_name:
    accession_number: "accession_number"
    genome: "/path/to/local/reference/genomic.fa"
    gff: "/path/to/local/reference/genome.gff"
scaffold_ref:
  reference_name:
    accession_number: "accession_number"
    genome: "/path/to/local/reference/genomic.fa"
    chr_info: "/path/to/local/info_file"
busco: "busco_database"
region:
  Region1:
    left_flank: "Flank1"
    right_flank: "Flank2"
    library: "/path/to/references/annotation.fasta" 
    minimap2: "-cx splice:hq -G16k"
    blast: "-word_size 7"
  Region2:
    left_flank: "Flank2"
    right_flank: "Flank2"
    library: "/path/to/references/annotation2.fasta" 
    minimap2: "-cx splice:hq -G16k "
    blast: "-word_size 7"
hifiasm_settings: "--ul-cut 50000 --b-cov 3 --h-cov 200 --m-rate 0.75"
nanopore:
  Sample_1:
    - "/path/to/local/Sample_1/nanopore/fastq1"
  Sample_2:
    - "/path/to/local/Sample_2/nanopore/fastq1"
pacbio:
  Sample_1:
    - "/path/to/local/Sample_1/pacbio/bam1"
  Sample_2:
    - "/path/to/local/Sample_2/pacbio/bam1"

